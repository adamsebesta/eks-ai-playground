# Zero Terraform-computed values needed here — the Pod Identity binding
# (terraform/main.tf) only cares about namespace+ServiceAccount name
# matching, both pinned explicitly below, same as faceapp's chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-for-fluent-bit
    targetRevision: "0.2.0"
    helm:
      releaseName: aws-for-fluent-bit
      values: |
        serviceAccount:
          create: true
          name: aws-for-fluent-bit
        cloudWatchLogs:
          enabled: true
          region: eu-central-1
          logGroupTemplate: "/aws/eks/eks-ai-playground/$kubernetes['namespace_name']"
          logStreamPrefix: "fluentbit-"
          autoCreateGroup: true
          logRetentionDays: 7
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
