# Permanent general-purpose capacity for application workloads — keeps the
# static `system` node group reserved for platform infra only (CoreDNS,
# Argo CD, Karpenter itself, ALB Controller, monitoring). Apps landing on
# the same pool as the autoscaler creates a circular-dependency risk if
# that pool were ever made fully elastic — this pool intentionally stays
# separate from `system` rather than replacing it.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: general
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  # Pinned in terraform/main.tf (module.karpenter.node_iam_role_name) —
  # static name, no substitution step needed.
  role: eks-ai-playground-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-playground
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-ai-playground
  tags:
    Project: eks-ai-playground
    Owner: adam
