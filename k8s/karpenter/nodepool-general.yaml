apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      # ollama/ollama-dev pin here via nodeSelector — same pairing pattern
      # as the gpu NodePool's workload: gpu-inference label.
      labels:
        workload: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-category
          operator: In
          values: ["t", "m"]
      expireAfter: 720h
  limits:
    cpu: "8"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m # less aggressive than the earlier demo's 30s —
                          # these are real, standing app workloads now
