apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      # ollama/ollama-dev pin here via nodeSelector — same pairing pattern
      # as the gpu NodePool's workload: gpu-inference label.
      labels:
        workload: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # AWS/Karpenter-specific — NOT under node.kubernetes.io/. That was
        # the actual bug: a label key that doesn't exist can never match
        # any instance type, so every scheduling attempt failed
        # deterministically (confirmed via `kubectl describe nodepool
        # general` — 324 identical failures, not a transient capacity issue).
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m"]
      expireAfter: 720h
  limits:
    cpu: "8"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m # less aggressive than the earlier demo's 30s —
                          # these are real, standing app workloads now
