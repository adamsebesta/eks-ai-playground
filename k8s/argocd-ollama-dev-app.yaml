apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adamsebesta/eks-ai-playground.git
    targetRevision: main
    path: charts/ollama
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: inference-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
