replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3 # GPU capacity is expensive — keep this small deliberately
  targetCPUUtilizationPercentage: 60

image:
  repository: 281981892670.dkr.ecr.eu-central-1.amazonaws.com/eks-ai-playground-faceapp
  tag: "15bffec65383eef4626431d3f2f4f0f265f27363"

service:
  port: 8000

# Matches aws_s3_bucket.faceapp_snapshots' name in terraform/main.tf —
# the app code doesn't use this yet (no S3 client in main.py), only the
# IAM/Pod Identity wiring is built so far. Flagged, not silently claimed done.
snapshotsBucket: eks-ai-playground-faceapp-snapshots

# Disabled by default — the chart stays cloud-agnostic; each cloud's
# specifics (ingress controller, class, annotation vocabulary) live in a
# values-<cloud>.yaml overlay instead of the template. See values-aws.yaml,
# values-gcp.yaml, values-azure.yaml for what actually differs.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
    nvidia.com/gpu: "1"
