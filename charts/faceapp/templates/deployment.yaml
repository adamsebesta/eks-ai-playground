apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "faceapp.fullname" . }}
  labels:
    {{- include "faceapp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "faceapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "faceapp.labels" . | nindent 8 }}
    spec:
      # Must match the aws_eks_pod_identity_association Terraform created —
      # that pairing (this SA, this namespace) is what actually grants the
      # S3 permissions, not anything visible in this pod spec itself.
      serviceAccountName: faceapp
      # Only nodes in the gpu node group carry this label — pins scheduling
      # there deliberately, same pairing as the taint/toleration below.
      nodeSelector:
        workload: gpu-inference
      # Matches the taint Terraform applies to every node in the gpu pool
      # (nvidia.com/gpu:NoSchedule) — without this, the scheduler skips
      # every GPU node for this pod entirely, same as any other workload.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: SNAPSHOTS_BUCKET
              value: {{ .Values.snapshotsBucket | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        # emptyDir, deliberately — a shared RWO PVC across HPA-scaled replicas
        # deadlocks exactly like ollama's did on day 2. Enrolled faces are
        # per-pod/ephemeral for now; a real fix needs EFS (RWX), deferred.
        - name: data
          emptyDir: {}
