apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-config
  namespace: inference
data:
  keep-alive: "24h"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: inference
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          command: ["sh", "-c"]
          args:
            - |
              ollama serve &
              SERVER_PID=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull qwen2.5:0.5b
              kill $SERVER_PID
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: OLLAMA_KEEP_ALIVE
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: keep-alive
            - name: TEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: ollama-secret
                  key: dummy-api-key

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: inference
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama
  namespace: inference
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
